name: Build & Release HexForge-Rust

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Test, Benchmark & Build Android 4-ABI APK + Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android NDK is installed
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -d "$SDK_DIR/ndk/27.3.13750724" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;27.3.13750724"
          fi
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full workspace Rust tests (release)
        run: cargo test --workspace --release

      - name: Run 350-turn Huge (22-civ) determinism & speed benchmark
        run: |
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42 --speculative

      - name: Build Desktop binaries
        run: bash scripts/build-desktop.sh

      - name: Build Android 4-ABI native libraries & APK
        run: |
          bash scripts/build-android.sh
          ./android/gradlew -p android assembleDebug -PskipRustBuild=true --console=plain

      - name: Verify APK native libraries & JNI symbols
        run: |
          APK="android/app/build/outputs/apk/debug/HexForge-Rust-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" | grep "lib/${abi}/libhexforge_app.so"
          done
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep "Java_quad_1native_QuadNative_activityOnCreate"
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep " T quad_main"

          mkdir -p release-assets
          cp "$APK" release-assets/HexForge-Rust-Android.apk
          cp target/release/hexforge release-assets/HexForge-Rust-Linux-x86_64
          cp target/release/hexforge-bench release-assets/HexForge-Bench-Linux-x86_64
          ls -lh release-assets/

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexforge-rust-builds
          path: |
            release-assets/HexForge-Rust-Android.apk
            release-assets/HexForge-Rust-Linux-x86_64
            release-assets/HexForge-Bench-Linux-x86_64

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRERELEASE_FLAG=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=""
          fi

          cat <<'NOTESEOF' > release-notes.md
          ## HexForge-Rust v0.4.0 — Unciv-Inspired 9-Era Overhaul, Realistic Workers & Separated City Tabs

          Built from the ground up in **100% Pure Rust** (zero JVM, zero GC) for **Android (all 4 ABIs, API 21+, Portrait & Landscape)** and **Desktop**!

          ### What's New in Update 0.4.0
          - **Separated City Production Tabs (`UNITS` | `BLDGS` | `WONDERS` | `BUILT`):** Units, City Buildings, globally exclusive World Wonders, and already-constructed structures each live in their own clean, thumb-friendly tab with live counts and concise yield summaries.
          - **Realistic Multi-Choice Worker System (`IMPROVE...` Sheet + `AUTO WORK` Toggle):**
            - **16 Distinct Tile Improvements** across all eras (*Farm, Mine, Pasture, Quarry, Plantation, Camp, Lumber Mill, Terrace Farm, Trading Post, Fort, Oil Well, Power Plant, Solar Farm, Research Outpost, Forward Airbase, Arcology Dome*) with **era-scaling tech yields** (e.g., *Fertilizer* boosts Farms/Pastures, *Chemistry* boosts Mines/Quarries, *Economics* boosts Trading Posts/Plantations/Camps, *Scientific Theory* boosts Lumber Mills).
            - **Terrain Engineering & Infrastructure:** Multi-turn realistic build progress (`1–4t`, accelerated by *Great Pyramids* & *Citizenship* policy), **Chop Forest (`+20 Prod` to nearest city)**, **Clear Jungle**, **Drain Marsh (`→ Grassland`)**, **Roads**, and **Railroads (`+15% City Production`)**.
            - **Strategic Fortifications & Combat Pillaging:** Build **Forts (`+50% Defense`)** and **Forward Airbases (`+50% Defense + Air Unit Rebase!`)** on borders; combat units can **PILLAGE** enemy improvements for **`+20 Gold` & `+20 HP`**, while Workers can **Repair** them!
            - **Late-Game Comfort:** Toggle **`AUTO WORK`** on any Worker so it automatically improves, drains, upgrades, and repairs tiles every turn without nagging!
          - **Full 9 Eras & 76 Technologies (`u128` O(1) Bitmask):** Complete historical-to-future arc inspired by Unciv (**Ancient → Classical → Medieval → Renaissance → Industrial → Modern → Atomic → Information → Future**) with a thumb-friendly 2-row Era Switcher.
          - **58 Authentic Units Across All 9 Eras & 9 Roles:** Adds *Chariot Archer, Longswordsman, Explorer, Great War Infantry, Marine, Paratrooper, Exo-Suit Squad, Gatling Gun, Anti-Tank Gun, Anti-Aircraft Gun, Mobile SAM, Plasma Infantry, Landship, Helicopter Gunship, Hover Tank, Trireme, Ironclad, Nuclear Submarine, Missile Cruiser, Great War Fighter, Guided Missile, Orbital Strike Drone*, and *Giant Death Robot*.
          - **26 Buildings + 12 Globally Unique World Wonders:** Adds *Windmill, Hospital, Solar Plant, Spaceport, Fusion Reactor* + *Statue of Liberty* and *Sydney Opera House* wonders.

          ### Included Downloads
          - **`HexForge-Rust-Android.apk`** (~7.7 MB) — Universal Android 5.0+ APK with all 4 stripped ABIs (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`). Installs **side-by-side** alongside Unciv (`com.orionflaxan.hexforge`) — updates cleanly over v0.3.0!
          - **`HexForge-Rust-Linux-x86_64`** (~2.0 MB) — Standalone native Linux Desktop binary.
          - **`HexForge-Bench-Linux-x86_64`** (~1.3 MB) — Headless 350-turn stress benchmark CLI.

          ### Verified 350-Turn Huge Map Performance (4,992 Tiles, 22 AI Civs, 113 Cities, 951 Formations / 1,498 Unit-Equivalents)
          - **All 350 Turns Total (Parallel):** **`2.44 seconds`** (**`6.89 ms/turn`** mean; **`9.42 ms/turn`** in Turns 301–350)
          - **Perceived Next-Turn (Speculative AI, 95.2% hit rate):** **`2.86 ms/turn`** overall (**`5.42 ms/turn`** in Turns 301–350)
          - **Large 16-Civ 350 Turns:** **`1.27 seconds`** total (**`3.59 ms/turn`** parallel / **`1.44 ms/turn`** speculative)
          - **Turn-351 Save / Load:** **`3.97 ms`** save (`126.4 KB`) / **`2.63 ms`** load (Save format v3)
          - **Strict Determinism:** 1-thread and multi-thread 350-turn simulations produce 100% bit-for-bit identical worlds (`0xc3bd7debbe7a6b36`).
          NOTESEOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --clobber
            gh release edit "$TAG" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --target "${GITHUB_SHA}" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi
