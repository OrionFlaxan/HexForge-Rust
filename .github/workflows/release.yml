name: Build & Release HexForge-Rust

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.5.1)'
        required: true
        default: 'v0.5.1'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Test, Benchmark & Build Android 4-ABI APK + Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android NDK is installed
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -d "$SDK_DIR/ndk/27.3.13750724" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;27.3.13750724"
          fi
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full workspace Rust tests (release)
        run: cargo test --workspace --release

      - name: Run 350-turn Huge (22 & 24-civ) determinism & speed benchmarks
        run: |
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42
          cargo run -p hexforge-bench --release -- --size huge --players 24 --turns 350 --seed 42
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42 --speculative

      - name: Build Desktop binaries
        run: bash scripts/build-desktop.sh

      - name: Build Android 4-ABI native libraries & APK
        run: |
          bash scripts/build-android.sh
          ./android/gradlew -p android assembleDebug -PskipRustBuild=true --console=plain

      - name: Verify APK native libraries & JNI symbols
        run: |
          APK="android/app/build/outputs/apk/debug/HexForge-Rust-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" | grep "lib/${abi}/libhexforge_app.so"
          done
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep "Java_quad_1native_QuadNative_activityOnCreate"
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep " T quad_main"

          mkdir -p release-assets
          cp "$APK" release-assets/HexForge-Rust-Android.apk
          cp target/release/hexforge release-assets/HexForge-Rust-Linux-x86_64
          cp target/release/hexforge-bench release-assets/HexForge-Bench-Linux-x86_64
          ls -lh release-assets/

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexforge-rust-builds
          path: |
            release-assets/HexForge-Rust-Android.apk
            release-assets/HexForge-Rust-Linux-x86_64
            release-assets/HexForge-Bench-Linux-x86_64

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRERELEASE_FLAG=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=""
          fi

          cat <<'NOTESEOF' > release-notes.md
          ## HexForge-Rust v0.5.1 — City Focus & Build Nothing, Foreign Civ Unit Info & 2-Tap Move Confirm

          Built from the ground up in **100% Pure Rust** (zero JVM, zero GC) for **Android (all 4 ABIs, API 21+, Portrait & Landscape)** and **Desktop** — **100% save-compatible with `v0.5.0`**!

          ### What's Fixed & New in Update 0.5.1
          - **Repeatable City Focus Projects & `BUILD NOTHING` (Zero Soft-Locks!):**
            - Added a 5th **`FOCUS`** tab inside every City modal (`UNITS | BLDGS | WONDR | FOCUS | BUILT`) plus a permanent 1-tap **`BUILD NOTHING`** footer button so a city can *never* block End Turn when nothing else needs to be built:
              - **Food Focus (Harvest):** Converts `40%` of City Production (min `+2`) into bonus **+Food/turn**.
              - **Stockpile Production:** Banks `50%` of City Production/turn (min `+2/t`, up to `250P` reserve) toward your next Unit/Building/Wonder (overflows `+25%` into Gold when full!).
              - **Produce Wealth / Research / Culture Festival:** Converts Production continuously into **+Gold**, **+Science**, or **+Culture** per turn.
              - **Build Nothing (Standby):** Keeps the city idle cleanly while satisfying the mandatory turn guard.
            - Auto-selects a non-empty tab whenever **`BUILD: <City>`** opens the City modal, and updates top-bar empire yields instantly on selection.
          - **Civilization Ownership & Diplomacy Info on Foreign Units, Cities & Territory:**
            - Tapping any foreign unit or city now displays its **Civ Color Swatch**, **Civilization Name**, **Leader**, color-coded **`[AT WAR]` / `[PEACE]`** status, and a 1-tap **`DIPLOMACY`** shortcut!
            - Zooming in shows a crisp 3-letter **Civ tag badge** below foreign map units (crimson border when at War), empty owned tiles display whose territory they belong to, and fog-of-war prevents tapping unseen units.
          - **Double-Tap Move/Attack Confirm & Double-Tap Unit Deselect (Zero Accidental Moves!):**
            - **`Confirm Move: 2-TAP`** is now **ON by default** (toggleable to `1-TAP` in **Options**):
              - **1st tap** on a reachable or attackable hex previews the full glowing path + target reticle (`TAP AGAIN: MOVE` / `TAP AGAIN: ATTACK`) and shows **`CONFIRM`** / **`CANCEL`** buttons in the bottom bar.
              - **2nd tap** on the same hex (or tapping **`CONFIRM`**) executes immediately; tapping a different valid hex shifts the preview without moving.
            - **Double-tap your selected unit** (or tap **`DESELECT`**) to cleanly clear selection & highlights so you can pan around freely again, plus a quick **`CITY`** button when garrisoned on your own city!

          ### Included Downloads
          - **`HexForge-Rust-Android.apk`** (~8.2 MB) — Universal Android 5.0+ APK with all 4 stripped ABIs (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`). Installs **side-by-side** alongside Unciv (`com.orionflaxan.hexforge`) — updates cleanly over `v0.5.0` while keeping your saved games!
          - **`HexForge-Rust-Linux-x86_64`** (~2.1 MB) — Standalone native Linux Desktop binary.
          - **`HexForge-Bench-Linux-x86_64`** (~1.3 MB) — Headless 350-turn stress benchmark CLI.

          ### Verified 350-Turn Huge Map Performance (4,992 Tiles, 24 Historical Civs & Uniques)
          - **Huge 22-Civ (115 Cities, 958 Formations / 1,442 Unit-Equiv):** **`2.24 seconds`** total (**`6.34 ms/turn`** mean; **`8.99 ms/turn`** in Turns 301–350) | **Speculative AI (95.0% hit):** **`3.26 ms/turn`** overall
          - **Huge ALL 24-Civ (131 Cities, 1,058 Formations / 1,530 Unit-Equiv):** **`2.52 seconds`** total (**`7.14 ms/turn`** mean; **`9.60 ms/turn`** in Turns 301–350)
          - **Turn-351 Save / Load (v4):** **`2.56–3.54 ms`** save (`128–132 KB`) / **`2.66–2.72 ms`** load
          - **Strict Determinism:** 1-thread and multi-thread 350-turn Huge simulations produce 100% bit-for-bit identical worlds (`0x9abb8dee13d2601a`).
          NOTESEOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --clobber
            gh release edit "$TAG" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --target "${GITHUB_SHA}" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi
