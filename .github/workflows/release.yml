name: Build & Release HexForge-Rust

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.5.0)'
        required: true
        default: 'v0.5.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Test, Benchmark & Build Android 4-ABI APK + Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android NDK is installed
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -d "$SDK_DIR/ndk/27.3.13750724" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;27.3.13750724"
          fi
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full workspace Rust tests (release)
        run: cargo test --workspace --release

      - name: Run 350-turn Huge (22 & 24-civ) determinism & speed benchmarks
        run: |
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42
          cargo run -p hexforge-bench --release -- --size huge --players 24 --turns 350 --seed 42
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42 --speculative

      - name: Build Desktop binaries
        run: bash scripts/build-desktop.sh

      - name: Build Android 4-ABI native libraries & APK
        run: |
          bash scripts/build-android.sh
          ./android/gradlew -p android assembleDebug -PskipRustBuild=true --console=plain

      - name: Verify APK native libraries & JNI symbols
        run: |
          APK="android/app/build/outputs/apk/debug/HexForge-Rust-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" | grep "lib/${abi}/libhexforge_app.so"
          done
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep "Java_quad_1native_QuadNative_activityOnCreate"
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep " T quad_main"

          mkdir -p release-assets
          cp "$APK" release-assets/HexForge-Rust-Android.apk
          cp target/release/hexforge release-assets/HexForge-Rust-Linux-x86_64
          cp target/release/hexforge-bench release-assets/HexForge-Bench-Linux-x86_64
          ls -lh release-assets/

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexforge-rust-builds
          path: |
            release-assets/HexForge-Rust-Android.apk
            release-assets/HexForge-Rust-Linux-x86_64
            release-assets/HexForge-Bench-Linux-x86_64

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRERELEASE_FLAG=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=""
          fi

          cat <<'NOTESEOF' > release-notes.md
          ## HexForge-Rust v0.5.0 — Pixel & Modern Dual UI Overhaul, 24 Historical Civilizations & Mandatory Turn Choices

          Built from the ground up in **100% Pure Rust** (zero JVM, zero GC) for **Android (all 4 ABIs, API 21+, Portrait & Landscape)** and **Desktop**!

          ### What's New in Update 0.5.0
          - **Live-Switchable Dual UI Themes (`PIXEL ART` & `MODERN SIMPLE`) + Procedural Sprites:**
            - Toggle anytime in **Options** (`options.toml`) between **Pixel Art (Retro 4X)** (crisp beveled RPG HUD frames, dithered pixel terrain, stepped pixel mountains & pine forests, and procedural 12×12 pixel-art sprites for every unit role, era, city, and tile improvement) and **Modern Simple (Clean)** (flat high-contrast vector cards and clean geometric icons).
            - Miniature procedural sprites now appear right inside the **City Production Tabs** and **Worker Actions Sheet**!
          - **24 Authentic Historical Civilizations with Leaders, Detailed Buffs, 24 Unique Units & 24 Unique Buildings:**
            - Play or battle against **24 iconic historical empires** (*Rome, Egypt, China, Japan, England, France, Germany, Greece, Persia, India, Mongolia, Russia, Arabia, Inca, Aztec, Carthage, Byzantium, Spain, Ottomans, Babylon, Korea, America, Norway, Indonesia*) — each featuring its real **Leader**, **detailed gameplay buffs** (*Japan Bushido* full strength when wounded, *Babylon* starts with *Writing*, *Norway* starts with *Sailing* + extra pillage gold, *Egypt/France* Wonder speed, *Rome/Inca* `-1t` Worker speed, *Germany* Rush-Buy discount, and more!), a **Civ-exclusive Unique Unit (UU)** (*Legion, Samurai, Keshik, Longbowman Range 3, Panzer, Chu-Ko-Nu, Kris Swordsman, Hwach'a...*), and a **Civ-exclusive Unique Building (UB)** (*Roman Forum, Paper Maker, Dojo, Hanse, Bazaar, Seowon, Candi, Walls of Babylon...*).
            - Upgraded `BuildingBits` to **`u128`** (zero heap allocation, O(1) bitmask across all **62 structures** = 26 base + 12 World Wonders + 24 Unique Buildings) and expanded **82 total units**.
          - **Mandatory Pre-Turn Choice Blocker (Never Forget Research or Production Again!):**
            - The bottom-right thumb button automatically transforms into **`CHOOSE TECH`** (opens Tech Tree to an unlocked era immediately) or **`BUILD: <City>`** (focuses camera on the idle city and opens its production tabs), only turning green as **`END TURN *`** once all targets are set (also blocks accidental `Space`/`Enter` skips, with optional **Force Policy Pick** toggle in Options).

          ### Included Downloads
          - **`HexForge-Rust-Android.apk`** (~8.2 MB) — Universal Android 5.0+ APK with all 4 stripped ABIs (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`). Installs **side-by-side** alongside Unciv (`com.orionflaxan.hexforge`) — updates cleanly over v0.4.0!
          - **`HexForge-Rust-Linux-x86_64`** (~2.1 MB) — Standalone native Linux Desktop binary.
          - **`HexForge-Bench-Linux-x86_64`** (~1.3 MB) — Headless 350-turn stress benchmark CLI.

          ### Verified 350-Turn Huge Map Performance (4,992 Tiles, Historical Civs & Uniques)
          - **Huge 22-Civ (115 Cities, 958 Formations / 1,442 Unit-Equiv):** **`2.24 seconds`** total (**`6.34 ms/turn`** mean; **`8.99 ms/turn`** in Turns 301–350) | **Speculative AI (95.0% hit):** **`3.26 ms/turn`** overall
          - **Huge ALL 24-Civ (131 Cities, 1,058 Formations / 1,530 Unit-Equiv):** **`2.52 seconds`** total (**`7.14 ms/turn`** mean; **`9.60 ms/turn`** in Turns 301–350)
          - **Large 16-Civ (61 Cities, 572 Formations):** **`1.40 seconds`** total (**`3.97 ms/turn`** parallel / **`1.70 ms/turn`** speculative)
          - **Turn-351 Save / Load (v4):** **`2.56–3.54 ms`** save (`128–132 KB`) / **`2.66–2.72 ms`** load
          - **Strict Determinism:** 1-thread and multi-thread 350-turn Huge simulations produce 100% bit-for-bit identical worlds (`0x9abb8dee13d2601a`).
          NOTESEOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --clobber
            gh release edit "$TAG" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --target "${GITHUB_SHA}" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi
