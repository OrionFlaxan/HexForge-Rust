name: Build & Release HexForge-Rust

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Test, Benchmark & Build Android 4-ABI APK + Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android NDK is installed
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -d "$SDK_DIR/ndk/27.3.13750724" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;27.3.13750724"
          fi
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full workspace Rust tests (release)
        run: cargo test --workspace --release

      - name: Run 350-turn Huge (22-civ) determinism & speed benchmark
        run: |
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42
          cargo run -p hexforge-bench --release -- --size huge --players 22 --turns 350 --seed 42 --speculative

      - name: Build Desktop binaries
        run: bash scripts/build-desktop.sh

      - name: Build Android 4-ABI native libraries & APK
        run: |
          bash scripts/build-android.sh
          ./android/gradlew -p android assembleDebug -PskipRustBuild=true --console=plain

      - name: Verify APK native libraries & JNI symbols
        run: |
          APK="android/app/build/outputs/apk/debug/HexForge-Rust-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" | grep "lib/${abi}/libhexforge_app.so"
          done
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep "Java_quad_1native_QuadNative_activityOnCreate"
          nm -D android/app/src/main/jniLibs/arm64-v8a/libhexforge_app.so | grep " T quad_main"

          mkdir -p release-assets
          cp "$APK" release-assets/HexForge-Rust-Android.apk
          cp target/release/hexforge release-assets/HexForge-Rust-Linux-x86_64
          cp target/release/hexforge-bench release-assets/HexForge-Bench-Linux-x86_64
          ls -lh release-assets/

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexforge-rust-builds
          path: |
            release-assets/HexForge-Rust-Android.apk
            release-assets/HexForge-Rust-Linux-x86_64
            release-assets/HexForge-Bench-Linux-x86_64

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRERELEASE_FLAG=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=""
          fi

          cat <<'NOTESEOF' > release-notes.md
          ## HexForge-Rust v0.3.0 — Mobile DPI UI, Rules/Codex, Options & 6-Era Expansion

          Built from the ground up in **100% Pure Rust** (zero JVM, zero GC) for **Android (all 4 ABIs, API 21+)** and **Desktop** — now redesigned for crisp, thumb-friendly mobile play in **both Portrait and Landscape**!

          ### What's New in Update 0.3.0
          - **True Android High-DPI Scaling + Portrait & Landscape Support:** Reads Android's real `DisplayMetrics.density` (`HEXFORGE_DPI_SCALE`) so every button, HUD bar, font, modal, and hex tile scales cleanly to thumb-friendly proportions on any phone or tablet — plus a **live UI Scale selector (`75%–150%`)** in **Options**!
          - **Persistent Options & Display Settings (`options.toml`):** Live UI Scale, Tile Yields overlay, Hex Grid toggle, Resource badges, Rust Perf/FPS HUD toggle, Auto-Next Unit, and Autosave interval.
          - **Custom Game Rules & 22-Civ Picker:** Choose **Difficulty** (`Settler`–`Deity`), **Game Speed** (`Quick`–`Marathon`), **Map Type** (`Continents`, `Pangaea`, `Archipelago`, `Fractal`), **Start Era** (`Ancient`–`Industrial`), **Victory Toggles**, **Corps/Armies & Fog-of-War toggles**, and **any of the 22 Civilizations** (each with a unique Empire Trait!).
          - **5-Tab In-Game Rules & Codex (Civilopedia):** Browse *How to Play*, *Combat & Corps/Supply Rules*, all *32 Units*, *50 Techs & 10 Unique World Wonders*, and *22 Civs & 20 Social Policies* from both Title and In-Game.
          - **6 Full Eras, 50 Techs, 32 Units (incl. Air & Naval), 21 Buildings + 10 Unique World Wonders & 5-Tree Social Policies:** Added Air Fighters/Bombers/Stealth Bombers, Submarines/Destroyers, Giant Mech, Worker Roads & Railroads, 10 globally exclusive World Wonders, and 20 Social Policies with **Culture Victory** (12 policies = 3 full trees).

          ### Included Downloads
          - **`HexForge-Rust-Android.apk`** (~7.6 MB) — Universal Android 5.0+ APK with all 4 stripped ABIs (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`). Installs **side-by-side** alongside Unciv (`com.orionflaxan.hexforge`) — updates cleanly over v0.2.0!
          - **`HexForge-Rust-Linux-x86_64`** (~1.9 MB) — Standalone native Linux Desktop binary.
          - **`HexForge-Bench-Linux-x86_64`** (~1.2 MB) — Headless 350-turn stress benchmark CLI.

          ### Verified 350-Turn Huge Map Performance (4,992 Tiles, 22 AI Civs, 106 Cities, 927 Formations / 1,522 Unit-Equivalents)
          - **All 350 Turns Total (Parallel):** **`1.96 seconds`** (**`5.54 ms/turn`** mean)
          - **Perceived Next-Turn (Speculative AI, 95.2% hit rate):** **`2.51 ms/turn`** overall (**`3.91 ms/turn`** in Turns 301–350)
          - **Turn-351 Save / Load:** **`3.57 ms`** save (`124 KB`) / **`2.78 ms`** load (Save format v2)
          - **Strict Determinism:** 1-thread and multi-thread 350-turn simulations produce 100% bit-for-bit identical worlds (`0x5a95e03a5fed7b94`).
          NOTESEOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --clobber
            gh release edit "$TAG" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              release-assets/HexForge-Rust-Android.apk \
              release-assets/HexForge-Rust-Linux-x86_64 \
              release-assets/HexForge-Bench-Linux-x86_64 \
              --target "${GITHUB_SHA}" \
              --title "HexForge-Rust ${TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi
