[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/bench",
    "crates/app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
